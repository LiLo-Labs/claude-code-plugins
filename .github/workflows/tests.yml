name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugins/model-paint/requirements-test.txt
      - name: Run the test suite
        working-directory: plugins/model-paint
        run: python -m pytest tests -q

  autosprite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugins/autosprite/requirements-test.txt
      - name: Run the test suite
        working-directory: plugins/autosprite
        run: python -m pytest tests -q

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No install step: the suite runs a fake Blender over a local socket and
      # speaks MCP by hand, so it needs neither pytest nor the network — the same
      # constraint the MCP server itself is written under.
      - name: Run the test suite
        working-directory: plugins/blender
        run: python3 tests/test_blendpipe.py
