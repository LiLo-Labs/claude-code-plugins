name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  model-paint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugins/model-paint/requirements-test.txt
      - name: Run the test suite
        working-directory: plugins/model-paint
        run: python -m pytest tests -q

  autosprite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r plugins/autosprite/requirements-test.txt
      - name: Run the test suite
        working-directory: plugins/autosprite
        run: python -m pytest tests -q

  blender:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      # No install step: the suite runs a fake Blender over a local socket and
      # speaks MCP by hand, so it needs neither pytest nor the network — the same
      # constraint the MCP server itself is written under.
      - name: Run the test suite
        working-directory: plugins/blender
        run: python3 tests/test_blendpipe.py

  review-desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run the session-start sweep tests
        working-directory: plugins/review-desk
        run: python3 tests/test_sweep.py
      - name: Run the after-push reminder tests
        working-directory: plugins/review-desk
        run: python3 tests/test_after_push.py
      - name: Run the desk build tests
        working-directory: plugins/review-desk
        run: python3 tests/test_build.py

  # The desk page itself, in Chromium, with window.claude stubbed. Real-host
  # behaviour still needs a person: automation cannot click inside the
  # artifact iframe.
  review-desk-page:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/review-desk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: plugins/review-desk/package-lock.json
      - name: Check the page's script parses
        run: |
          python3 -c "import build_desk as b; print(b.page_script(b.template().replace(b.MARKER, '{}')))" > "$RUNNER_TEMP/desk-script.js"
          node --check "$RUNNER_TEMP/desk-script.js"
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Run the page tests
        run: npm test
